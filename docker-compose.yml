version: '3'

services:
  yaml-site:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./boxes.yaml:/app/boxes.yaml
      # Optional overrides — create these files first (see custom-boxes.yaml.example / .env.example)
      # - ./custom-boxes.yaml:/app/custom-boxes.yaml
      # - ./.env:/app/.env
    restart: unless-stopped
