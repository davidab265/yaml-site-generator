apiVersion: v1
kind: ConfigMap
metadata:
  name: yaml-site-config
data:
  boxes.yaml: |
    # Site title (plain text)
    title: "My Site"
    # Site subtitle
    subtitle: "Your Gateway to Powerful Development Tools"
    # Optional HTML title (will override the plain text title if provided)
    titleHtml: "<span class='text-light-a0'>My</span><span class='text-primary-light'>Site</span>"
    # Number of columns in the grid (1-4)
    columns: 3
    boxes:
      - logo: "📚"
        title: "Documentation"
        description: "Comprehensive guides and references"
        link: "/docs"
        customClass: "bg-tonal-100"
      
      - logo: "ℹ️"
        title: "Wiki"
        description: "Community knowledge base"
        link: "/wiki"
      
      - logo: "🔧"
        title: "Tools"
        description: "Utilities and resources"
        link: "/tools"
      
      - logo: "💬"
        title: "Community"
        description: "Forums and discussions"
        link: "/community"
      
      - logo: "🚀"
        title: "Quick Start"
        description: "Get started in minutes"
        link: "/quickstart"
        customClass: "bg-tonal-200"
      
      - logo: "⬇️"
        title: "Resources"
        description: "Downloads and assets"
        link: "/resources"
